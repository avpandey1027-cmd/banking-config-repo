server:
  port: 8080

spring:
  application:
    name: api-gateway

  profiles:
    active:
      - dev

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks

  data:
    redis:
      host: localhost:6371

  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 5
            redis-rate-limiter.burstCapacity: 10

      routes:
        - id: account-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - path=/api/account/**
          filters:
            - StripPrefix=1

        - id: transaction-service
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/transcations/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: transactionCB
       - id: auth-service
         uri: lb://AUTH-SERVICE
         predicates:
           - Path=/auth**,/oauth2/**
         filters:
           - StripPrefix=1

eureka:
  client:
    service-url:
      defaultzone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
